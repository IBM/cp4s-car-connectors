# GitHub Actions workflow for running unit tests on Python 3.11

name: Unit test

on:
  push:
    branches: '**'
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  test:
    name: build (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run unit tests
        run: |
          bash ./unit-test.sh
          echo "End Unit Tests..."

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: All builds passed
        run: echo "All matrix builds passed"
