# GitHub Actions workflow for running unit tests on Python 3.11

name: Unit test

on:
  push:
    branches: '**'
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # install all your dependencies, including car-connector-framework>=4.0.3
          pip install pytest

      - name: Run unit tests
        run: |
          bash ./unit-test.sh
          echo "End Unit Tests..."
